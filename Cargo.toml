[package]
name = "post_ambient_vst"
version = "1.1.1"
edition = "2021"
description = "Post Ambient VST (Southwest St. Petersburg - Super Atmospheric) - Rust & JavaScript Prototype"
authors = ["cherdakmd", "arena-agent"]
repository = "https://github.com/cherdakmd/post_ambient_vst"

[lib]
crate-type = ["cdylib"]

[dependencies]
nih-plug = { version = "0.6", features = ["vst3"] }
egui = "0.24"
egui-winit = "0.24"
egui-dock = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"

# 12 Крутых Фишек (Innovations v1.1.1) - Rust Dependencies
# 1. SW Wind Gate (noise processing)
# 2. Brutalist Texture Mapping (spectral processing)
# 3. Panel Echo Resonance (echo/resonance sync)
# 4. Post-Punk Sync (tempo/bpm sync)
# 5. Courtyard Stereo Expansion (stereo width)
# 6. Granular Noise Storm (granularity)
# 7. Concrete Wall Filter (filter cutoff/resonance)
# 8. Wind Dynamics Modulation (LFO modulation)
# 9. Post-Punk Distortion Engine (distortion/texture)
# 10. Atmospheric Reverb Landscape (reverb size/depth)
# 11. Grey Sky GUI (brutalist theme/fonts)
# 12. FL Studio Preset Bridge (JSON presets)

[features]
default = []
super_atmospheric = [] # Включает все 12 фишек и 12 улучшений

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
